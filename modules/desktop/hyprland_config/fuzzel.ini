# ~/.config/fuzzel/fuzzel.ini
# fuzzel(5) — section based key/value pairs. Verify with: fuzzel --check-config

[main]

# ---------------------------------------------------------------- appearance
font=JetBrainsMono Nerd Font:size=11,Noto Sans:size=11
# font size vs monitor DPI: auto|yes|no. `auto` uses DPI while all monitors
# are at scale 1, else the scaling factor. Safer than a hardcoded `yes`.
dpi-aware=auto
use-bold=yes
letter-spacing=0

# window geometry — `width` is in characters, not pixels, and excludes
# margins and borders.
width=42
lines=12
tabs=8
horizontal-pad=20
vertical-pad=10
inner-pad=8

# where the window sits: top-left|top|top-right|left|center|right|bottom-*
anchor=center
x-margin=0
y-margin=0

# `overlay` (default) draws above fullscreen and lockscreens; `top` draws
# above normal windows only. `top` keeps fuzzel off your lock screen.
layer=top

# ------------------------------------------------------------ input behaviour
prompt="> "
placeholder=Search applications…
match-mode=fzf
sort-result=yes
match-counter=no
hide-before-typing=no
enable-mouse=yes

# match against more than the defaults (filename,name,generic)
fields=filename,name,generic,keywords,categories

# --------------------------------------------------------------- application
icons-enabled=yes
# icon-theme is deliberately NOT set: the value is case sensitive and must name
# an installed theme. Leaving it unset uses the system default.
show-actions=yes
list-executables-in-path=no
terminal=kitty -e
filter-desktop=no

# --------------------------------------------------------------- window close
# exit-on-keyboard-focus-loss=yes makes fuzzel vanish if focus-follows-mouse
# moves focus away. `no` is friendlier under a tiling WM.
exit-on-keyboard-focus-loss=no
auto-select=no
password-character=*

# ---------------------------------------------------------------- performance
# default cache ($XDG_CACHE_HOME/fuzzel) stores launch counts used for sorting.
# Set to /dev/null to disable.
#cache=/dev/null
scaling-filter=box

[colors]
# RGBA hex, no leading '#'
background=14141af2
text=d8dee9ff
message=d8dee9ff
prompt=33ccffff
placeholder=7a8394ff
input=d8dee9ffff
match=88c0d0ff
selection=2c3140ff
selection-text=d8dee9ff
selection-match=33ccffff
counter=7a8394ff
border=33ccffcc

[border]
width=2
radius=10
selection-radius=6

[dmenu]
# text prints the entry, index prints its zero-based index
mode=text
# essential for `cliphist list | fuzzel --dmenu`: with an empty clipboard
# history, fuzzel would otherwise open a useless empty window
exit-immediately-if-empty=yes

[key-bindings]
# Action bindings are XKB key names. If Shift is a modifier the key MUST be
# lowercase (`Control+Shift+v`, never `Control+Shift+V`), or it never fires.
# A combination maps to only one action; unbind a default with `action=none`.
#
# Example: make Ctrl+j/k navigate, freeing Ctrl+k from delete-line-forward
# delete-line-forward=none
# next=Control+j Down
# prev=Control+k Up
#
# custom-1..19 exit with code 10..28 after executing — useful for scripting
# Ctrl+1 = copy the selection somewhere special, etc.

